# -- General Settings --
set -s escape-time 0
set -g history-limit 20000
set-option -g -q mouse on
set -g focus-events on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# -- Prefix --
set -g prefix C-Space
bind C-Space send-prefix

# -- Key Bindings --
# Reload config
bind R source-file ~/.tmux.conf \; display "Configuration reloaded."

# Split windows (preserves current path)
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Swap windows
bind -r < swap-window -t -1
bind -r > swap-window -t +1

# Resize panes
bind -n M-u resize-pane -L 5
bind -n M-i resize-pane -D 5
bind -n M-o resize-pane -U 5
bind -n M-p resize-pane -R 5

# -- Navigation (Smart Pane Switching) --
# Seamless navigation between Neovim and Tmux
# Requires https://github.com/christoomey/vim-tmux-navigator in Neovim
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Restore clearing the screen with <prefix> C-l (since C-l is now navigation)
bind C-l send-keys 'C-l'
bind C-\\ send-keys 'C-\\'

# Keep standard prefix navigation as backup
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# -- Copy Mode --
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# -- Status Bar / Colors --
# Color settings derived from https://github.com/statico/dotfiles
set -g status-interval 0
set -g status-fg colour240
set -g status-bg colour233
set -g status-left "#[fg=colour242] #{host} "
set -g status-right "#[fg=colour242]:#{session_name}:#{window_index}.#{pane_index} "
set -g window-status-format "#[bg=colour233,fg=colour240] ·#I· #W "
set -g window-status-current-format "#[bg=colour233,fg=colour240,nobold] |#I| #W #[fg=black,bg=colour233,nobold]"
set -g window-status-current-style bg=colour39,fg=colour235
set -g window-status-activity-style bg=colour245,fg=colour233
set -g window-status-separator ""
set -g status-justify centre
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Need to reconfirm if these were for working around something on ubuntu
# Add truecolor support
set-option -sa terminal-overrides ",xterm*:Tc"
# Default terminal is 256 colors
set -g default-terminal "tmux-256color"
