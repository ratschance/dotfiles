add_newline = false

# Reduced format
format = """
$username\
$hostname\
$localip\
$shlvl\
$kubernetes\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$env_var\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$status\
$os\
$container\
$netns\
$shell\
$character"""

[character]
success_symbol = "[→](#53AFBC)"
error_symbol = "[→](red)"

[kubernetes]
disabled = false

[directory]
truncate_to_repo = false
style = "#C678DD"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "yellow"

[username]
format = "[|](cyan)[$user]($style)[|](cyan) "
show_always = false

